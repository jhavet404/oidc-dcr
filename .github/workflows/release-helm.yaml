name: Release Helm Chart to Quay
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "latest"

      - name: Log in to Quay.io
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | helm registry login quay.io \
            --username "${{ secrets.QUAY_USERNAME }}" \
            --password-stdin

      - name: Semver release
        uses: cocogitto/cocogitto-action@v4
        id: release
        with:
          command: bump
          args: --auto
          git-user: "GitHub Actions"
          git-user-email: "actions@github.com"

      - name: Print version
        run: "echo '${{ steps.release.outputs.version }}'"

      - name: Update Chart Version from Tag
        run: |
          # Extract version number from the tag
          TAG_VERSION="${{ steps.release.outputs.version }}"
          # Edit Chart.yaml
          echo "Updating Chart.yaml with version: $TAG_VERSION"
          yq -i ".version = \"$TAG_VERSION\"" Chart.yaml

      - name: Package Helm Chart
        run: |
          helm package . --destination .dist

      - name: Push Chart to Quay (OCI)
        run: |
          CHART_PACKAGE=$(ls .dist/*.tgz)
          helm push "$CHART_PACKAGE" oci://quay.io/jhavet404
